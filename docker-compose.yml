# Produção (VPS): painel + bot (webhook) num domínio só:
#   https://DOMINIO/          → painel  (127.0.0.1:WEB_PORTA)
#   https://DOMINIO/telegram  → webhook do bot (127.0.0.1:BOT_PORTA)
# O HTTPS fica com o proxy da VPS:
#   • VPS com nginx (já usado por outros sites): deploy/nginx/cobra.conf + certbot
#       docker compose up -d --build
#   • VPS vazia: Caddy incluso, com HTTPS automático nas portas 80/443
#       docker compose --profile caddy up -d --build
# Preencha o .env antes (veja "Deploy" no README).
services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?defina no .env}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?defina no .env}
        NEXT_PUBLIC_SITE_URL: https://${DOMINIO:?defina DOMINIO no .env}
    env_file: .env
    environment:
      NEXT_PUBLIC_SITE_URL: https://${DOMINIO}
      PORT: 3000
    ports:
      - '127.0.0.1:${WEB_PORTA:-3100}:3000'
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    env_file: .env
    environment:
      BOT_MODO: webhook
      PORT: 8080
      # Registrado no Telegram automaticamente quando o bot sobe.
      TELEGRAM_WEBHOOK_URL: https://${DOMINIO}/telegram
    ports:
      - '127.0.0.1:${BOT_PORTA:-8090}:8080'
    restart: unless-stopped

  caddy:
    profiles: ['caddy']
    image: caddy:2.10-alpine
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMINIO: ${DOMINIO}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - web
      - bot
    restart: unless-stopped

volumes:
  caddy_data:
