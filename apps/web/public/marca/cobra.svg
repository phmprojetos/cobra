      <ellipse cx="203.6" cy="385.8" rx="11" ry="7" transform="rotate(202 203.6 385.8)"/>
      <ellipse cx="289.9" cy="391.8" rx="11" ry="7" transform="rotate(166 289.9 391.8)"/>
