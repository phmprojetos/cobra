# nginx da VPS → containers do Cobra (portas do docker-compose: WEB_PORTA=3100, BOT_PORTA=8090).
# Instalação:
#   cp deploy/nginx/cobra.conf /etc/nginx/sites-available/cobraphm.duckdns.org
#   ln -s /etc/nginx/sites-available/cobraphm.duckdns.org /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d cobraphm.duckdns.org     # adiciona o HTTPS e o redirecionamento
server {
    listen 80;
    server_name cobraphm.duckdns.org;

    client_max_body_size 12m;   # upload de documentos dos clientes (limite do bucket: 10 MB)

    # Só o webhook do Telegram chega ao bot; /health e /jobs ficam internos.
    location = /telegram {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
